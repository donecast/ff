[project]
name = "ffassist"
version = "0.1.0"
description = "MFL draft assistant for Fantasy Cares Eliminator slow drafts"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "slack-bolt>=1.20",
    "rapidfuzz>=3.9",
    "anthropic>=0.50",
]

[project.scripts]
ffassist = "ffassist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffassist"]
